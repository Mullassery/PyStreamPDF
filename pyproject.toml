[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "PyStreamPDF"
dynamic = ["version"]
description = "Intelligence engine for PDFs: selective retrieval, structure analysis, and token-efficient RAG"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com" }]
keywords = ["pdf", "retrieval", "rag", "ai", "intelligence", "search", "indexing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
]
requires-python = ">=3.9"
dependencies = ["rich>=13.0", "pyyaml>=6.0"]

[project.optional-dependencies]
# Real BPE tokenization for accurate token-count estimates. Falls back to the
# len(text)/4 heuristic (clearly labeled as approximate) when not installed.
tiktoken = ["tiktoken>=0.5"]
dev = [
    "maturin>=1.0,<2.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.1",
    "reportlab>=4.0",
    "tiktoken>=0.5",
]

[project.scripts]
pystreampdf = "pystreampdf.cli:main"

[project.urls]
Repository = "https://github.com/Mullassery/PyStreamPDF"
Issues = "https://github.com/Mullassery/PyStreamPDF/issues"

[tool.maturin]
python-source = "python"
module-name = "pystreampdf._core"
manifest-path = "python/Cargo.toml"
include = ["LICENSE"]
