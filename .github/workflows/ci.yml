name: Tests & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  rust-build:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
            core
            python

      - name: Build Rust
        run: cargo build --release --all-features

      - name: Test Rust
        run: cargo test --release --all-features

  python-tests:
    name: Python Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
            core
            python

      - name: Download PDFium native library
        run: |
          curl -sL -o pdfium-linux-x64.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7999/pdfium-linux-x64.tgz"
          tar xzf pdfium-linux-x64.tgz
          cp lib/libpdfium.so ./libpdfium.so

      - name: Set up virtualenv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Build native extension (maturin develop)
        run: maturin develop --release

      - name: Run pytest
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v --tb=short
          else
            echo "ERROR: expected test suite at repo-root tests/ directory, none found"
            exit 1
          fi

  # Lint gate for the Python package (PYSTREAMPDF-004). Uses the curated
  # ruleset in pyproject.toml ([tool.ruff.lint]); previously the repo had
  # no enforced Python lint at all.
  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.5.0"

      - name: Ruff
        run: ruff check python/
