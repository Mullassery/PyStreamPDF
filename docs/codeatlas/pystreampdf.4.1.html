<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CodeAtlas</title>
<script src="https://unpkg.com/cytoscape@3.23.0/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.4.0/cytoscape-dagre.js"></script>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; }
  #cy { width: 100vw; height: 100vh; }
  header { padding: 12px 16px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<header>
  <strong>CodeAtlas</strong>
  <p>Owns 169 symbols across 13 file(s).</p>
</header>
<div id="cy"></div>
<script>
const data = {"nodes": [{"data": {"id": "intelligence", "label": "intelligence", "description": "Owns 31 symbols across 7 file(s)."}}, {"data": {"id": "ocr", "label": "ocr", "description": "Owns 26 symbols across 4 file(s)."}}, {"data": {"id": "optimization", "label": "optimization", "description": "Owns 35 symbols across 5 file(s)."}}, {"data": {"id": "scripts", "label": "scripts", "description": "Owns 1 symbols across 2 file(s)."}}, {"data": {"id": "semantic", "label": "semantic", "description": "Owns 77 symbols across 8 file(s)."}}, {"data": {"id": "structure", "label": "structure", "description": "Owns 55 symbols across 5 file(s)."}}, {"data": {"id": "validation", "label": "validation", "description": "Owns 37 symbols across 6 file(s)."}}], "edges": [{"data": {"id": "edge_0", "source": "pystreampdf", "target": "intelligence", "label": "calls"}}, {"data": {"id": "edge_1", "source": "pystreampdf", "target": "ocr", "label": "calls"}}, {"data": {"id": "edge_2", "source": "pystreampdf", "target": "validation", "label": "calls"}}, {"data": {"id": "edge_3", "source": "intelligence", "target": "pystreampdf", "label": "calls"}}, {"data": {"id": "edge_4", "source": "optimization", "target": "pystreampdf", "label": "calls"}}, {"data": {"id": "edge_5", "source": "semantic", "target": "pystreampdf", "label": "calls"}}, {"data": {"id": "edge_6", "source": "structure", "target": "pystreampdf", "label": "calls"}}]};
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: data,
  style: [
    { selector: 'node', style: {
      'label': 'data(label)',
      'shape': 'round-rectangle',
      'background-color': '#eef2ff',
      'border-color': '#6366f1',
      'border-width': 1,
      'width': 'label',
      'padding': '10px',
      'text-valign': 'center',
      'text-halign': 'center',
      'font-size': '12px',
    }},
    { selector: 'edge', style: {
      'label': 'data(label)',
      'curve-style': 'bezier',
      'target-arrow-shape': 'triangle',
      'font-size': '10px',
      'text-rotation': 'autorotate',
    }}
  ],
  layout: { name: 'dagre', rankDir: 'LR' }
});
cy.on('tap', 'node', evt => {
  const node = evt.target;
  if (node.data('linkUrl')) { window.location.href = node.data('linkUrl'); }
});
</script>
</body>
</html>
